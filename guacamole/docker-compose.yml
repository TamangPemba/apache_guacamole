services:
  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: unless-stopped
    networks:
      - guacnet
    volumes:
      - ./guacd_data:/usr/local/share/guacamole
      - ./recordings:/var/lib/guacamole/recordings:rw
    healthcheck:
      disable: true

  postgres:
    image: postgres:latest
    container_name: guac_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guac_user
      POSTGRES_PASSWORD: guac_password
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - guacnet

  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    restart: unless-stopped
    depends_on:
      - guacd
      - postgres
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USER: guac_user
      POSTGRESQL_PASSWORD: guac_password

      # Enabling AD/LDAP Authentication
      ENABLE_ENVIRONMENT_PROPERTIES: "true"
      LDAP_HOSTNAME: "192.168.90.90"
      LDAP_PORT: "389"
      LDAP_ENCRYPTION_METHOD: "none"
      LDAP_USER_BASE_DN: "DC=dc,DC=pemba"
      LDAP_MAX_SEARCH_RESULTS: "5000"
      LDAP_USERNAME_ATTRIBUTE: "sAMAccountName"
      LDAP_SEARCH_BIND_DN: "pemba@dc.pemba"
      LDAP_SEARCH_BIND_PASSWORD: "domanuserpassword"
      LDAP_USER_SEARCH_FILTER: "(&(objectClass=user)(!(objectClass=computer)))"
      LDAP_GROUP_BASE_DN: "OU=GuacamoleAdmin,DC=dc,DC=pemba"
      LDAP_GROUP_SEARCH_FILTER: "(objectClass=group)"
      LDAP_MEMBER_ATTRIBUTE: "member"
      LDAP_MEMBER_ATTRIBUTE_TYPE: "dn"

      # Recording
      RECORDING_SEARCH_PATH: '/var/lib/guacamole/recordings'
 
    volumes:
      - ./guacamole_data:/config
      - ./recordings:/var/lib/guacamole/recordings:rw

    networks:
      - guacnet

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - guacamole
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - guacnet

networks:
  guacnet:

