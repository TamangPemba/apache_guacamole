events {}

http {
    server {
        listen 80;
        server_name bastion.pemba.com.np;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name baston.pemba.com.np;

        # SSL Certificate
        ssl_certificate /etc/nginx/certs/pemba.crt;
        ssl_certificate_key /etc/nginx/certs/pemba.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Proxy for Guacamole Web Interface
        location / {
            proxy_pass http://guacamole:8080/guacamole/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
	    client_max_body_size 100M;
	    proxy_request_buffering off;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            send_timeout 3600;
        }

        # Serve Guacamole Session Recordings
        location /recordings/ {
            alias /var/lib/guacamole/recordings/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_format html;
            autoindex_localtime on;

            types {
                application/json json;
                video/mp4 mp4;
            }

            # Allow browsing of recording subdirectories
            location ~ /recordings/([a-f0-9-]+)/ {
                autoindex on;
            }
        }
    }
}

